<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apex — Sign In</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0e0f11; --s1: #16181c; --s2: #1e2026; --line: #2a2d35;
    --t1: #f0f1f3; --t2: #8b8fa8; --t3: #555870;
    --blue: #4C8EE8; --blue-d: #3a7bd5;
  }
  body {
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--t1);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    background: var(--s1);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 48px 44px;
    width: 380px;
    text-align: center;
    box-shadow: 0 32px 80px rgba(0,0,0,0.4);
  }
  .logo {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 32px;
  }
  .logo-dot {
    width: 28px; height: 28px; border-radius: 50%;
    background: linear-gradient(135deg, var(--blue), #6478C8);
  }
  .logo-text {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.3px;
  }
  h1 {
    font-size: 24px;
    font-weight: 600;
    margin-bottom: 8px;
    letter-spacing: -0.3px;
  }
  .sub {
    font-size: 15.5px;
    color: var(--t2);
    line-height: 1.6;
    margin-bottom: 36px;
  }
  .btn-google {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    width: 100%;
    padding: 13px 20px;
    background: var(--s2);
    border: 1px solid var(--line);
    border-radius: 12px;
    color: var(--t1);
    font-family: inherit;
    font-size: 16px;
    font-weight: 500;
    cursor: pointer;
    text-decoration: none;
    transition: background 0.15s, border-color 0.15s;
    margin-bottom: 12px;
    white-space: nowrap;
  }
  .btn-google:hover {
    background: #24272f;
    border-color: #3a3d48;
  }
  .btn-google svg { flex-shrink: 0; }
  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 20px 0;
    color: var(--t3);
    font-size: 14px;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--line);
  }
  .btn-apple {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    width: 100%;
    padding: 13px 20px;
    background: var(--t1);
    border: 1px solid var(--line);
    border-radius: 12px;
    color: #0e0f11;
    font-family: inherit;
    font-size: 16px;
    font-weight: 500;
    cursor: pointer;
    text-decoration: none;
    transition: opacity 0.15s;
    margin-bottom: 12px;
    white-space: nowrap;
  }
  .btn-apple:hover { opacity: 0.9; }
  .coming-soon {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--t3);
    background: var(--s2);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 2px 8px;
    margin-left: 6px;
  }
  .footer {
    margin-top: 32px;
    font-size: 13.5px;
    color: var(--t3);
    line-height: 1.7;
  }
  .footer a { color: var(--t3); text-decoration: underline; }
  .error-msg {
    background: rgba(224,85,85,0.1);
    border: 1px solid rgba(224,85,85,0.25);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 14.5px;
    color: #e05555;
    margin-bottom: 20px;
    display: none;
  }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-dot"></div>
    <div class="logo-text">Apex</div>
  </div>

  <h1>Welcome back</h1>
  <p class="sub">Sign in to access your portfolio, projects, and team workspace.</p>

  <div class="error-msg" id="err">Sign-in failed. Please try again.</div>

  <a href="/auth/google" class="btn-google">
    <svg width="18" height="18" viewBox="0 0 18 18">
      <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/>
      <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 009 18z"/>
      <path fill="#FBBC05" d="M3.964 10.707A5.41 5.41 0 013.682 9c0-.593.102-1.17.282-1.707V4.961H.957A8.996 8.996 0 000 9c0 1.452.348 2.827.957 4.039l3.007-2.332z"/>
      <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 00.957 4.961L3.964 7.293C4.672 5.163 6.656 3.58 9 3.58z"/>
    </svg>
    Continue with Google
  </a>

  <a href="#" class="btn-apple" style="opacity:0.45;cursor:default;" title="Coming soon">
    <svg width="16" height="18" viewBox="0 0 814 1000">
      <path fill="#0e0f11" d="M788.1 340.9c-5.8 4.5-108.2 62.2-108.2 190.5 0 148.4 130.3 200.9 134.2 202.2-.6 3.2-20.7 71.9-68.7 141.9-42.8 61.6-87.5 123.1-155.5 123.1s-85.5-39.5-164-39.5c-76 0-103.7 40.8-165.9 40.8s-105.5-57.8-155.5-127C46 482.6 0 355.5 0 337.2c0-54.4 21.7-108.6 60.5-145.5C112.4 142.8 177.6 120 244.8 120c74.2 0 131.5 46.6 176.4 46.6 43.6 0 112.8-49.3 197.2-49.3zM554.1 88.4c22.6-27.1 38.6-64.8 38.6-102.5 0-5.1-.4-10.3-1.3-14.5C557.4-22 489.9 8.7 446.9 55.2c-19.9 21.8-38.7 59-38.7 97.7 0 5.8.9 11.7 1.3 13.7 2.5.4 6.4.7 10.3.7 39.3 0 103.6-28.5 134.3-78.9z"/>
    </svg>
    Continue with Apple
    <span class="coming-soon">Soon</span>
  </a>

  <p class="footer">
    By signing in you agree to our Terms of Service and Privacy Policy.<br>
    Your data is stored securely and never shared.
  </p>
</div>

<script>
  const params = new URLSearchParams(location.search);
  if (params.get('error')) document.getElementById('err').style.display = 'block';
</script>
</body>
</html>
